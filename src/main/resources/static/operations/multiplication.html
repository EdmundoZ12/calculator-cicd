<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multiplicación - Calculadora CI/CD</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<main class="operation-page">

    <div class="operation-symbol">x</div>

    <h1>Multiplicación</h1>

    <p>Ingrese los números que desea Multiplicar.</p>

    <form id="multiplication-form" class="calculator-form">

        <div class="form-group">
            <label for="firstNumber">Primer número</label>

            <input
                    type="number"
                    id="firstNumber"
                    step="any"
                    required
            >
        </div>

        <div class="form-group">
            <label for="secondNumber">Segundo número</label>

            <input
                    type="number"
                    id="secondNumber"
                    step="any"
                    required
            >
        </div>

        <button type="submit" class="calculate-button">
            Multiplicar
        </button>

    </form>

    <div id="result-container" class="result-container hidden">
        <span>Resultado</span>
        <strong id="result"></strong>
    </div>

    <p id="error-message" class="error-message"></p>

    <a href="/" class="back-link">
        ← Volver al inicio
    </a>

</main>

<script src="/js/multiplication.js"></script>

</body>
</html>
