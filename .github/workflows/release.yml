name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v5
        with:
          java-version: '20'
          distribution: 'temurin'
          cache: maven

      - name: Validate tag version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          POM_VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          echo "Tag version: ${TAG_VERSION}"
          echo "POM version: ${POM_VERSION}"

          if [ "${TAG_VERSION}" != "${POM_VERSION}" ]; then
            echo "Tag version does not match pom.xml version."
            exit 1
          fi

          echo "Version validation successful."

      - name: Build, test and package application
        run: mvn -B clean verify --file pom.xml

      - name: Verify release artifact
        shell: bash
        run: |
          JAR_COUNT=$(find target -maxdepth 1 -type f -name "*.jar" | wc -l)

          if [ "${JAR_COUNT}" -ne 1 ]; then
            echo "Expected exactly one JAR artifact."
            echo "Found: ${JAR_COUNT}"
            exit 1
          fi

          echo "Release artifact:"
          ls -lh target/*.jar

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            target/*.jar \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  deploy:
    name: Trigger AWS Deployment

    needs:
      - release

    if: ${{ vars.ENABLE_AWS_DEPLOY == 'true' }}

    uses: ./.github/workflows/deploy.yml

    with:
      version: ${{ github.ref_name }}

    secrets: inherit